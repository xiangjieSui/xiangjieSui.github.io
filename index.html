<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Xiangjie Sui</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #ffffff;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }
        *, *::before, *::after {
            box-sizing: inherit;
        }
        .card {
            background-color: #fff;
            box-shadow: 0 4px 4px 4pt rgba(0, 0, 0, 0.1);
            margin: 80px auto;
            width: 90%;
            max-width: 820px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 36px;
            padding: 40px;
            border-radius: 10px;
        }
        .card img {
            width: 180px;
            height: 200px;
            margin-top: 30px;
            margin-right: 0;
            border-radius: 10px;
            object-fit: cover;
            flex-shrink: 0;
        }
        .card-content {
            margin-left: 30px;
            flex: 1 1 auto;
            max-width: 560px;
        }
        .card-header {
            font-size: 28px;
            margin-bottom: 20px;
        }
        .card-info {
            font-size: 20px;
            line-height: 2;
        }
        .card-info p {
            margin: 5px 0;
        }
        .card-info a {
            color: #0000EE;
            text-decoration: none;
        }
        .card-links {
            font-size: clamp(16px, 2vw, 20px);
            list-style-type: none;
            padding: 0;
            display: flex;
            flex-wrap: nowrap;
            gap: clamp(10px, 2vw, 18px);
            white-space: nowrap;
            overflow-x: auto;
        }
        .card-links li {
            margin: 5px 0;
        }
        .card-links a {
            color: #0000EE;
            text-decoration: none;
        }
        .card-links a:hover {
            text-decoration: underline;
        }
        @media (max-width: 700px) {
            body {
                padding: 12px;
            }
            .card {
                flex-direction: column-reverse;
                align-items: flex-start;
                gap: 0;
                margin: 24px auto;
                width: 100%;
                padding: 24px;
            }
            .card-content {
                margin-left: 0;
                max-width: none;
            }
            .card-header {
                font-size: 26px;
            }
            .card-info {
                font-size: 17px;
                line-height: 1.7;
            }
            .card img {
                width: 140px;
                height: 156px;
                margin: 0 0 20px 0;
            }
        }
    </style>
</head>

<body>
    <div class="card">
        <div class="card-content">
            <div class="card-header">Xiangjie Sui</div>
            <div class="card-info">
                <p>Assistant Professor</p>
                <p>Faculty of Data Science</p>
                <a href="https://cityu.edu.mo/en/">City University of Macau</a>
                <p>Email: xjsui@cityu.edu.mo</p>
            </div>
            <p></p>
            <!-- <hr size=2pt; color="black"> -->
            <p></p>
            <ul class="card-links">
                <a href="./pages/bio.html">Biography</a>
                <a href="./pages/pub.html">Publications</a>
                <a href="https://scholar.google.com/citations?user=IAnTG2cAAAAJ&hl">Google Scholar</a>
                <a href="https://github.com/xiangjieSui">GitHub</a>
                <a href="./pages/cv.pdf" target="_blank">CV</a>
            </ul>
        </div>
  
        <img src="./cv_xiangjie.png" alt="Xiangjie Sui" />
    
    </div>  
</body>
</html>
